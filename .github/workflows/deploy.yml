name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    environment:
      name: candidate
      url: ${{ steps.candidate.outputs.version_url }}
    outputs:
      version_id: ${{ steps.candidate.outputs.version_id }}
      version_url: ${{ steps.candidate.outputs.version_url }}
      source_revision: ${{ steps.candidate.outputs.source_revision }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SITE_URL: https://kamacafe.lupesko.com
      WRANGLER_LOG_PATH: ${{ github.workspace }}/.wrangler.log
    steps:
      - uses: actions/checkout@v4
      - name: Validate release context
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Release candidates can only be created from main.' >&2
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN must be configured.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate:catalog
      - run: npm run typecheck
      - run: npm test
      - name: Build the production artifact once
        run: npm run build
        env:
          VITE_REPOSITORY_URL: https://github.com/${{ github.repository }}
          VITE_CONTRIBUTING_URL: https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md
          VITE_SITE_URL: https://kamacafe.lupesko.com
      - run: npm run validate:social -- --production
      - run: npm run validate:deployment
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Upload immutable candidate without deploying
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: npx wrangler versions upload --tag "$GITHUB_SHA" --message "KamaCafe candidate $GITHUB_SHA"
      - name: Validate candidate identity
        id: candidate
        run: |
          npx wrangler versions list --json > "$RUNNER_TEMP/versions.json"
          candidate_json="$(npx tsx scripts/parse-wrangler-output.ts \
            --output "$RUNNER_TEMP/wrangler-output.ndjson" \
            --versions-json "$RUNNER_TEMP/versions.json" \
            --source-revision "$GITHUB_SHA" \
            --canonical-origin "$VITE_SITE_URL")"
          version_id="$(jq -r '.versionId' <<< "$candidate_json")"
          version_url="$(jq -r '.versionUrl' <<< "$candidate_json")"
          {
            echo "version_id=$version_id"
            echo "version_url=$version_url"
            echo "source_revision=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Release candidate'
            echo
            echo "- Source revision: \`$GITHUB_SHA\`"
            echo "- Version ID: \`$version_id\`"
            echo "- Version URL: $version_url"
            echo "- Canonical origin: $VITE_SITE_URL"
            echo '- Production traffic: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: candidate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kamacafe.lupesko.com
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_LOG_PATH: ${{ github.workspace }}/.wrangler.log
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.source_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Confirm reviewed candidate tag
        run: |
          npx wrangler versions list --json > "$RUNNER_TEMP/versions.json"
          npx tsx scripts/parse-wrangler-output.ts \
            --assert-version-tag \
            --versions-json "$RUNNER_TEMP/versions.json" \
            --version-id "${{ needs.candidate.outputs.version_id }}" \
            --source-revision "${{ needs.candidate.outputs.source_revision }}"
      - name: Promote the reviewed version at 100 percent
        run: npx wrangler versions deploy "${{ needs.candidate.outputs.version_id }}@100%" --yes
      - name: Verify production
        run: npx tsx scripts/verify-production-deployment.ts --hostname kamacafe.lupesko.com --expected-version "${{ needs.candidate.outputs.version_id }}"
      - name: Record release evidence
        run: |
          {
            echo '## Production release'
            echo
            echo "- Source revision: \`${{ needs.candidate.outputs.source_revision }}\`"
            echo "- Version ID: \`${{ needs.candidate.outputs.version_id }}\`"
            echo '- Traffic: 100%'
            echo '- Canonical URL: https://kamacafe.lupesko.com'
          } >> "$GITHUB_STEP_SUMMARY"
