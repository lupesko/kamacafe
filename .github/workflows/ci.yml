name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://kamacafe.lupesko.com
      WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run validate:catalog
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate:social -- --production
      - run: npm run validate:deployment
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - run: npm run test:e2e
      - run: npm run test:performance
